<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-input {
            appearance: none;
            -webkit-appearance: none;
        }

        :root {
            /* Light theme colors */
            --bg-color: #a1a1a1;
            --container-bg: #e0e4e7;
            --shadow-light: #ffffff;
            --shadow-dark: #b8c7dd;
            --inset-light: #f7f7f7;
            --inset-dark: #c2cad5;
            --text-color: #646464;
            --accent-blue: #5685ff;
            --accent-lightblue: #78bfff;
            --accent-purple: #576ee6;
            --accent-pink: #ec7eda;
            --accent-teal: #44dbe5;
            --accent-green: #68deb4;
        }

        .dark-theme {
            /* Dark theme colors */
            --bg-color: #2a2a2a;
            --container-bg: #3a3a3a;
            --shadow-light: #4a4a4a;
            --shadow-dark: #1a1a1a;
            --inset-light: #454545;
            --inset-dark: #252525;
            --text-color: #d0d0d0;
            --accent-blue: #4a7ae4;
            --accent-lightblue: #6aa9e0;
            --accent-purple: #4a5ed0;
            --accent-pink: #d86bc9;
            --accent-teal: #3bc5d0;
            --accent-green: #5bc9a0;
        }

        body {
            background-color: var(--bg-color);
            transition: background-color 0.3s ease;
        }

        .container {
            background-color: var(--container-bg);
            transition: background-color 0.3s ease;
        }

        .neu-shadow {
            box-shadow: 5px 5px 13px var(--shadow-dark), -5px -5px 13px var(--shadow-light);
        }

        .neu-shadow-inset {
            box-shadow: inset 4px 3px 3px 0px var(--shadow-dark), inset -2px -4px 4px 0px var(--shadow-light);
        }

        .neu-shadow-inset-btn {
            box-shadow: inset 7px 2px 2px 0px var(--inset-dark), inset -3px -2px 2px 0px var(--inset-light);
        }

        .neu-shadow-active {
            box-shadow: inset 4px 3px 3px 0px var(--shadow-dark), inset -2px -2px 2px 0px var(--inset-light) !important;
        }

        .text-color {
            color: var(--text-color);
        }

        .bg-container {
            background-color: var(--container-bg);
        }

        .hover-bg {
            background-color: var(--container-bg);
        }

        .hover-bg:hover {
            background-color: var(--inset-light);
        }

        /* add active state handling with JS */
        .pressed {
            box-shadow: inset 4px 3px 3px 0px var(--shadow-dark), inset -2px -2px 2px 0px var(--inset-light) !important;
        }
    </style>
</head>

<body class="flex justify-center items-center h-screen font-sans">

    <div class="relative shadow-xl px-20 py-24 rounded-3xl w-[800px] h-[600px] container">
        <!-- theme toggle button -->
        <button id="themeToggle"
            class="top-4 right-4 absolute flex justify-center items-center neu-shadow rounded-full w-12 h-12 text-color">
            <i class="fa-solid fa-moon"></i>
        </button>

        <!-- first row -->
        <div class="flex flex-row justify-between">
            <!-- text logo -->
            <div
                class="flex justify-center items-center [text-shadow:1px_1px_2px_var(--container-bg),0_0_0_black,1px_4px_6px_var(--shadow-light)] neu-shadow rounded-2xl size-28 font-bold text-[#5685ff]/85 text-[56px]">
                DP
            </div>

            <!-- magnified div and radio buttons -->
            <div class="flex flex-col gap-2">
                <!-- tried to make magnified effect -->
                <div class="inline-block relative size-8">
                    <div class="neu-shadow-inset-btn rounded-full size-full">
                    </div>
                    <div
                        class="top-1/2 left-1/2 absolute neu-shadow rounded-full size-7 translate-x-[-50%] translate-y-[-50%]">
                    </div>
                </div>

                <!-- radio buttons -->
                <form class="flex flex-col justify-between items-center gap-2 h-fit">
                    <label
                        class="relative flex justify-center items-center neu-shadow rounded-full size-8 cursor-pointer">
                        <input type="radio" name="selector" checked class="peer size-full cursor-pointer hide-input">
                        <div
                            class="hidden absolute inset-0 peer-checked:flex justify-center items-center neu-shadow rounded-full size-full">
                            <div class="bg-[#78bfff] rounded-full size-3"></div>
                        </div>
                    </label>

                    <label
                        class="relative flex justify-center items-center neu-shadow rounded-full size-8 cursor-pointer">
                        <input type="radio" name="selector" class="peer size-full cursor-pointer hide-input">
                        <div
                            class="hidden absolute inset-0 peer-checked:flex justify-center items-center neu-shadow rounded-full size-full">
                            <div class="bg-[#78bfff] rounded-full size-3"></div>
                        </div>
                    </label>
                </form>
            </div>

            <!-- check boxes -->
            <div class="flex flex-col justify-between py-4 h-28">
                <label class="inline-block relative w-14 h-5 cursor-pointer">
                    <input type="checkbox" checked class="peer hidden">
                    <div
                        class="neu-shadow-inset-btn peer-checked:bg-[#5685ff] rounded-full size-full transition-colors peer-checked:shadow-[4px_3px_3px_0px_var(--accent-blue)_inset]">
                    </div>
                    <div
                        class="-top-1 left-0 absolute bg-container neu-shadow peer-checked:shadow-[4px_4px_8px_var(--shadow-dark)] rounded-full size-7 transition-transform peer-checked:translate-x-full">
                    </div>
                </label>

                <label class="inline-block relative w-14 h-5 cursor-pointer">
                    <input type="checkbox" class="peer hidden">
                    <div
                        class="neu-shadow-inset-btn peer-checked:bg-[#5685ff] rounded-full size-full transition-colors peer-checked:shadow-[4px_3px_3px_0px_var(--accent-blue)_inset]">
                    </div>
                    <div
                        class="-top-1 left-0 absolute bg-container neu-shadow peer-checked:shadow-[4px_4px_8px_var(--shadow-dark)] rounded-full size-7 transition-transform peer-checked:translate-x-full">
                    </div>
                </label>
            </div>

            <!-- music player and select -->
            <div class="flex flex-col justify-between w-52 h-32">
                <!-- music player -->
                <div class="flex flex-row justify-between">
                    <button
                        class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 text-color pressable">
                        <i class="fa-chevron-left fa-solid"></i>
                    </button>
                    <button
                        class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 text-color pressable">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                    <button
                        class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 text-color pressable">
                        <i class="fa-chevron-right fa-solid"></i>
                    </button>
                </div>

                <!-- select -->
                <div class="relative w-52">
                    <div class="flex flex-row justify-between items-center neu-shadow px-5 py-3 rounded-xl cursor-pointer"
                        id="customSelect">
                        <span class="text-color" id="selectedText">Select Option</span>
                        <i class="text-color transition-transform duration-200 fa-solid fa-chevron-down"
                            id="chevron"></i>
                    </div>

                    <div class="hidden z-10 absolute bg-container neu-shadow mt-2 rounded-xl w-full" id="dropdown">
                        <div class="py-2">
                            <div class="px-5 py-3 text-color transition-colors cursor-pointer hover-bg"
                                data-value="Option 1">Option 1</div>
                            <div class="px-5 py-3 text-color transition-colors cursor-pointer hover-bg"
                                data-value="Option 2">Option 2</div>
                            <div class="px-5 py-3 text-color transition-colors cursor-pointer hover-bg"
                                data-value="Option 3">Option 3</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- search box -->
        <div class="flex flex-row mt-6">
            <div class="flex flex-row items-center neu-shadow-inset px-6 py-3 rounded-3xl w-72 text-color">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for ..."
                    class="bg-transparent ml-2 focus:outline-none text-color">
            </div>
        </div>

        <!-- last row -->
        <div class="flex flex-row mt-6">
            <!-- left side -->
            <div class="flex flex-col w-1/3">
                <button class="neu-shadow py-2 rounded-3xl text-color pressable">
                    Button
                </button>

                <!-- social action buttons -->
                <div class="flex flex-row justify-between mt-6">
                    <button class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 pressable">
                        <i class="text-[#ec7eda] fa-solid fa-heart"></i>
                    </button>
                    <button class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 pressable">
                        <i class="text-[#78bfff] fa-solid fa-comment"></i>
                    </button>
                    <button class="flex justify-center items-center neu-shadow rounded-xl w-14 h-12 pressable">
                        <i class="text-[#5685ff] fa-solid fa-bookmark"></i>
                    </button>
                </div>

                <!-- share and plus buttons -->
                <div class="flex flex-row justify-between mt-6">
                    <button class="neu-shadow py-2 rounded-3xl w-32 text-color pressable">
                        <i class="mr-1 fa-solid fa-share-nodes"></i> Share
                    </button>
                    <button class="neu-shadow rounded-full w-12 h-12 text-color pressable">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- right side -->
            <div class="flex justify-between -mt-24 pb-2 pl-10 w-2/3 h-72">
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-32 overflow-hidden">
                        <div class="bg-[#78bfff] rounded-3xl size-24"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#78bfff] rounded-full w-5 h-5"></div>
                    </div>
                </div>
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-28 overflow-hidden">
                        <div class="bg-[#5685ff] rounded-3xl size-16"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#5685ff] rounded-full w-5 h-5"></div>
                    </div>
                </div>
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-52 overflow-hidden">
                        <div class="bg-[#576ee6] rounded-3xl size-44"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#576ee6] rounded-full w-5 h-5"></div>
                    </div>
                </div>
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-36 overflow-hidden">
                        <div class="bg-[#ec7eda] rounded-3xl size-24"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#ec7eda] rounded-full w-5 h-5"></div>
                    </div>
                </div>
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-44 overflow-hidden">
                        <div class="bg-[#44dbe5] rounded-3xl size-32"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#44dbe5] rounded-full w-5 h-5"></div>
                    </div>
                </div>
                <div class="flex flex-col justify-end">
                    <div
                        class="flex flex-col justify-end items-center neu-shadow-inset rounded-3xl w-8 h-32 overflow-hidden">
                        <div class="bg-[#68deb4] rounded-3xl size-24"></div>
                    </div>
                    <div class="flex justify-center items-center neu-shadow mt-2 rounded-full w-8 h-8">
                        <div class="bg-[#68deb4] rounded-full w-5 h-5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- scripts -->
    <script>
        const select = document.getElementById('customSelect');
        const dropdown = document.getElementById('dropdown');
        const selectedText = document.getElementById('selectedText');
        const chevron = document.getElementById('chevron');

        select.addEventListener('click', () => {
            dropdown.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        });

        document.querySelectorAll('#dropdown > div > div').forEach(option => {
            option.addEventListener('click', (e) => {
                selectedText.textContent = e.target.dataset.value;
                dropdown.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            });
        });

        document.addEventListener('click', (e) => {
            if (!select.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        });

        // theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');

            if (body.classList.contains('dark-theme')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });

        // button press effect
        document.querySelectorAll('.pressable').forEach(button => {
            button.addEventListener('mousedown', function () {
                this.classList.add('pressed');
            });

            button.addEventListener('mouseup', function () {
                this.classList.remove('pressed');
            });

            button.addEventListener('mouseleave', function () {
                this.classList.remove('pressed');
            });
        });
    </script>

</body>

</html>
